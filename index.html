<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Runesprint — Essence Eternal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1 12 8 8 15 4 8Z' fill='%238fe3ff'/></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;background:#08050f;overflow:hidden}
  canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================================================
   RUNESPRINT — an endless runecrafting dash
   single-file canvas game · fixed timestep · letterboxed 960x540
   ============================================================ */
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const W = 960, H = 540, GROUND = 440, PX = 182;   // PX = player screen x
const GRAV = 2000, JUMP_V = -720, MAX_FALL = 1200;

const view = { dpr:1, s:1, ox:0, oy:0, cw:0, ch:0 };
function resize(){
  view.dpr = Math.min(window.devicePixelRatio||1, 2);
  view.cw = window.innerWidth; view.ch = window.innerHeight;
  cvs.width = Math.round(view.cw*view.dpr); cvs.height = Math.round(view.ch*view.dpr);
  cvs.style.width = view.cw+'px'; cvs.style.height = view.ch+'px';
  view.s = Math.min(view.cw/W, view.ch/H);
  view.ox = (view.cw - W*view.s)/2; view.oy = (view.ch - H*view.s)/2;
}
window.addEventListener('resize', resize); resize();

/* ---------------- rune table (level unlocks) ---------------- */
const RUNES = [
  ['Air',    '#8fe3ff',  1, 'Ai'], ['Mind',  '#ff9d9d',  2, 'Mn'],
  ['Water',  '#7fb2ff',  5, 'Wa'], ['Earth', '#c9b37e',  9, 'Ea'],
  ['Fire',   '#ff9a3d', 14, 'Fi'], ['Body',  '#d68cff', 20, 'Bo'],
  ['Cosmic', '#ffe97d', 27, 'Co'], ['Chaos', '#ff6b6b', 35, 'Ch'],
  ['Nature', '#7dff9b', 44, 'Na'], ['Law',   '#e8e8ff', 54, 'La'],
  ['Death',  '#a08bff', 65, 'De'], ['Blood', '#ff3d5e', 77, 'Bl']
];
function runeAt(l){ let r = RUNES[0]; for(const q of RUNES) if(l >= q[2]) r = q; return r; }
function xpNeed(l){ return 30 + l*20; }

/* ---------------- state ---------------- */
let mode='title', t=0, dist=0, speed=330, lastMile=0;
let player = { y:GROUND, vy:0, jump:false, slide:0, run:0, coyote:0, falling:false };
let essence=0, runes=0, xp=0, xpTotal=0, level=1, combo=0, essenceGot=0;
let objects=[], parts=[], floats=[], nextSpawn=0;
let banner=null, deathInfo=null, deathT=0, dw=null, shake=0, jumpHeld=false;
let best = +(localStorage.getItem('runesprint.best')||0);

function reset(){
  dist=0; speed=330; lastMile=0; t=0;
  player = { y:GROUND, vy:0, jump:false, slide:0, run:0, coyote:0, falling:false };
  essence=0; runes=0; xp=0; xpTotal=0; level=1; combo=0; essenceGot=0;
  objects=[]; parts=[]; floats=[]; nextSpawn=520;
  banner=null; deathInfo=null; deathT=0; dw=null; shake=0;
  spawn();
}
function start(){ reset(); mode='play'; }
function die(reason){
  if(mode!=='play') return;
  const d = Math.floor(dist), nb = d > best;
  if(nb){ best = d; localStorage.setItem('runesprint.best', best); }
  deathInfo = { reason, dist:d, essenceGot, runes, xp:Math.floor(xpTotal), level, newBest:nb };
  deathT = 0; shake = 14;
  dw = (reason==='fall') ? null : { x:PX, y:player.y, vx:-160, vy:-430, rot:0 };
  mode='dead';
  sfxDeath();
}

/* ---------------- spawner ---------------- */
function overGapAt(wx){
  for(const o of objects) if(o.t==='gap' && wx > o.x && wx < o.x+o.gw) return true;
  return false;
}
function spawn(){
  while(nextSpawn < dist + 1600){
    const x = nextSpawn, r = Math.random();
    if(r < 0.30){                                        // essence arc
      const n = 4 + (Math.random()*3|0);
      for(let i=0;i<n;i++)
        objects.push({ t:'ess', x:x+i*46, y:GROUND-60-Math.sin(i/(n-1)*Math.PI)*130 });
      nextSpawn += n*46 + 200 + Math.random()*160;
    } else if(r < 0.52){                                 // chasm + essence over it
      const gw = 110 + Math.random()*90;
      objects.push({ t:'gap', x, gw });
      for(let i=0;i<3;i++) objects.push({ t:'ess', x:x+gw*(0.25+0.25*i), y:GROUND-115-i*18 });
      nextSpawn += gw + 270 + Math.random()*170;
    } else if(r < 0.74){                                 // low arch (slide!)
      objects.push({ t:'arch', x });
      if(Math.random() < 0.6)
        for(let i=0;i<3;i++) objects.push({ t:'ess', x:x-70+i*60, y:GROUND-32 });
      nextSpawn += 310 + Math.random()*200;
    } else {                                             // altar + lead-in essence
      objects.push({ t:'altar', x, done:false });
      for(let i=0;i<4;i++) objects.push({ t:'ess', x:x-260+i*55, y:GROUND-70 });
      nextSpawn += 430 + Math.random()*240;
    }
  }
  objects = objects.filter(o => o.x > dist - 300);
}

/* ---------------- particles / floaters ---------------- */
function puff(x,y,n,col,sp){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = (0.4+Math.random()*0.6)*sp;
    parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - sp*0.4, life:0.5+Math.random()*0.4, max:0.9, col, r:2+Math.random()*3 });
  }
}
function floatTxt(x,y,txt,col,big){ floats.push({ x, y, txt, col, big:!!big, life:1.1 }); }

/* ---------------- actions ---------------- */
function doJump(){
  if(mode!=='play' || player.falling) return;
  if(player.y >= GROUND-1 || player.coyote > 0){
    player.vy = JUMP_V; player.jump = true; player.slide = 0; player.coyote = 0;
    puff(PX, GROUND, 6, '#9a86ff', 60); sfxJump();
  }
}
function doSlide(){
  if(mode!=='play') return;
  if(player.y < GROUND-1){ player.vy = Math.max(player.vy, 820); return; }  // fast-fall
  if(player.slide <= 0){ player.slide = 0.55; puff(PX, GROUND, 5, '#7d6bd6', 50); }
}

/* ---------------- update ---------------- */
function update(dt){
  t += dt;
  if(mode==='dead'){
    deathT += dt;
    if(dw){ dw.vy += 1500*dt; dw.x += dw.vx*dt; dw.y += dw.vy*dt; dw.rot += 5*dt; }
    updateFx(dt); return;
  }
  if(mode!=='play'){ updateFx(dt); return; }

  speed = Math.min(760, speed + dt*7);
  dist += speed*dt;
  player.run += dt*speed/55;

  // vertical physics
  player.vy = Math.min(MAX_FALL, player.vy + GRAV*dt);
  player.y += player.vy*dt;
  if(player.y >= GROUND-0.5){
    if(overGapAt(dist+PX)) player.falling = true;
    else {
      if(player.jump){ player.jump=false; puff(PX, GROUND, 4, '#8f7ce0', 45); }
      player.y = GROUND; player.vy = 0;
    }
  }
  player.coyote = (!player.falling && player.y <= GROUND+0.5 && player.vy >= 0) ? 0.09 : player.coyote-dt;
  if(player.falling && player.y > GROUND+120){ die('fall'); return; }
  if(player.slide > 0) player.slide -= dt;

  // staff trail
  if(Math.random() < dt*30)
    parts.push({ x:PX+34, y:player.y-72, vx:-40-Math.random()*40, vy:-10+Math.random()*20,
                 life:0.5, max:0.5, col:runeAt(level)[1], r:1.5+Math.random()*2 });

  // objects
  const slid = player.slide > 0;
  const pTop = player.y - (slid ? 26 : 58), pBot = player.y;
  const cy = player.y - (slid ? 14 : 30);
  for(const o of objects){
    const sx = o.x - dist;
    if(o.t==='ess' && !o.dead){
      if(Math.abs(sx-PX) < 34 && Math.abs(o.y-cy) < 46){
        o.dead = true; essence++; essenceGot++; xp += 2; xpTotal += 2;
        floatTxt(sx, o.y-14, '+1', '#8fe3ff');
        puff(sx, o.y, 5, '#8fe3ff', 70); sfxPick();
      }
    } else if(o.t==='arch'){
      if(sx > PX-160 && sx < PX+160){                        // slab [x-88,x+88] x [GROUND-150,GROUND-40]
        if(PX+22 > sx-88 && PX-22 < sx+88 && pTop < GROUND-40 && pBot > GROUND-150){ die('arch'); return; }
      }
    } else if(o.t==='altar' && !o.done && sx <= PX+32){
      o.done = true;
      if(essence >= 3){
        combo++;
        const mult = 1 + 0.25*Math.min(combo-1, 8);
        const gain = Math.round(15*mult);
        essence -= 3; runes += 3; xp += gain; xpTotal += gain;
        const rc = runeAt(level)[1];
        puff(sx, GROUND-120, 14, rc, 130);
        floatTxt(sx, GROUND-160, '+'+gain+' XP', rc, true);
        if(combo > 1) floatTxt(sx, GROUND-190, 'combo ×'+mult.toFixed(2), '#ffe97d');
        sfxCraft();
      } else {
        combo = 0;
        floatTxt(sx, GROUND-140, 'need 3 essence!', '#ff9d9d');
      }
    }
  }

  // level ups
  let gained = 0;
  while(xp >= xpNeed(level)){ xp -= xpNeed(level); level++; gained++; }
  if(gained){
    const r = RUNES.find(q => q[2] === level);
    banner = { txt:'RUNECRAFTING LEVEL '+level, sub: r ? r[0].toUpperCase()+' RUNES UNLOCKED' : 'THE SHRINES SING LOUDER', life:2.4 };
    speed = Math.min(820, speed + 12*gained);
    puff(PX, player.y-60, 16, (r||['',' #ffe97d'])[1] || '#ffe97d', 150);
    sfxLevel();
  }

  // milestone
  const mile = Math.floor(dist/500);
  if(mile > lastMile){ lastMile = mile; floatTxt(W/2, 240, mile*500+'m', '#e8e8ff', true); }

  spawn();
  updateFx(dt);
}
function updateFx(dt){
  for(const p of parts){ p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 300*dt; }
  parts = parts.filter(p => p.life > 0);
  for(const f of floats){ f.life -= dt; f.y -= 42*dt; }
  floats = floats.filter(f => f.life > 0);
  if(banner){ banner.life -= dt; if(banner.life <= 0) banner = null; }
  if(shake > 0) shake = Math.max(0, shake - dt*22);
}

/* ---------------- audio ---------------- */
let AC = null;
function initAudio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); }
function tone(f0, f1, dur, type, vol, delay){
  if(!AC) return;
  try{
    const t0 = AC.currentTime + (delay||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
    g.gain.setValueAtTime(vol||0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function sfxJump(){ tone(260, 540, 0.16, 'square', 0.07); }
function sfxPick(){ tone(880, 1320, 0.09, 'sine', 0.09); }
function sfxCraft(){ tone(520, 520, 0.12, 'triangle', 0.1); tone(660, 660, 0.12, 'triangle', 0.1, 0.07); tone(880, 880, 0.2, 'triangle', 0.1, 0.14); }
function sfxLevel(){ [660,830,990,1320].forEach((f,i)=>tone(f, f, 0.15, 'triangle', 0.09, i*0.08)); }
function sfxDeath(){ tone(360, 55, 0.7, 'sawtooth', 0.16); tone(240, 40, 0.8, 'square', 0.08, 0.05); }

/* ---------------- draw helpers ---------------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function txt(s,x,y,size,col,align,weight,fam){
  ctx.font = (weight||700)+' '+size+'px '+(fam||'Georgia, serif');
  ctx.fillStyle = col; ctx.textAlign = align||'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
function gem(x,y,r,col,glow){
  if(glow){ ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = glow; }
  ctx.beginPath();
  ctx.moveTo(x,y-r); ctx.lineTo(x+r*0.7,y); ctx.lineTo(x,y+r); ctx.lineTo(x-r*0.7,y);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  if(glow){ ctx.restore(); }
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.moveTo(x,y-r*0.55); ctx.lineTo(x+r*0.32,y); ctx.lineTo(x,y+r*0.25); ctx.lineTo(x-r*0.32,y); ctx.closePath(); ctx.fill();
}
function hash(n){ const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }

/* ---------------- scenery ---------------- */
function drawSky(){
  // ambient fill across the entire device canvas (letterbox included)
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  const g = ctx.createLinearGradient(0,0,0,view.ch);
  g.addColorStop(0,'#0a0618'); g.addColorStop(1,'#100a22');
  ctx.fillStyle = g; ctx.fillRect(0,0,view.cw,view.ch);
}
function drawWorldBG(){
  // aurora bands
  for(let i=0;i<2;i++){
    ctx.beginPath();
    const base = 70+i*46, amp = 26+8*i;
    ctx.moveTo(-10, base);
    for(let x=-10;x<=W+10;x+=30) ctx.lineTo(x, base + Math.sin(x*0.008 + t*(0.5+0.3*i) + i*2)*amp);
    ctx.lineTo(W+10, base-60); ctx.lineTo(-10, base-60); ctx.closePath();
    ctx.fillStyle = i ? 'rgba(64,32,110,0.16)' : 'rgba(40,70,120,0.14)';
    ctx.fill();
  }
  // stars
  const span = W+60;
  for(let i=0;i<70;i++){
    const sx = (((hash(i)*span*3 - dist*0.045) % span) + span) % span - 30;
    const sy = 14 + hash(i+7)*230;
    const tw = 0.5 + 0.5*Math.sin(t*2 + i*1.7);
    ctx.globalAlpha = 0.25 + 0.55*tw;
    ctx.fillStyle = '#cfd6ff';
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
  // far mountains
  ctx.beginPath(); ctx.moveTo(-10, GROUND);
  for(let x=-10;x<=W+10;x+=36){
    const wx = x + dist*0.15;
    ctx.lineTo(x, 296 - Math.sin(wx*0.004)*46 - Math.sin(wx*0.0013+2)*66 - Math.sin(wx*0.011)*10);
  }
  ctx.lineTo(W+10, GROUND); ctx.closePath();
  ctx.fillStyle = '#171030'; ctx.fill();
  // ruined towers (parallax .3)
  const p1 = 300, off1 = dist*0.3, k1 = Math.floor(off1/p1)-1;
  for(let k=0;k<W/p1+2;k++){
    const wx = (k1+k)*p1, sx = wx - off1, h1 = 130 + hash(k1+k)*150, w1 = 34 + hash(k1+k+3)*30;
    ctx.fillStyle = '#1d1438';
    ctx.fillRect(sx, GROUND-h1, w1, h1);
    ctx.beginPath(); ctx.moveTo(sx-6, GROUND-h1); ctx.lineTo(sx+w1/2, GROUND-h1-24-hash(k1+k)*18); ctx.lineTo(sx+w1+6, GROUND-h1); ctx.closePath(); ctx.fill();
    const wc = hash(k1+k+9) > 0.5;
    ctx.fillStyle = wc ? 'rgba(143,227,255,'+(0.3+0.3*Math.sin(t*3+wx))+')' : 'rgba(255,154,61,'+(0.25+0.25*Math.sin(t*2.2+wx))+')';
    ctx.fillRect(sx+w1/2-3, GROUND-h1*0.6, 6, 9);
  }
  // dead trees / columns (parallax .5)
  const p2 = 230, off2 = dist*0.5, k2 = Math.floor(off2/p2)-1;
  for(let k=0;k<W/p2+2;k++){
    const wx = (k2+k)*p2, sx = wx - off2, h2 = 60 + hash(k2+k+21)*70;
    ctx.strokeStyle = '#221641'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, GROUND); ctx.lineTo(sx+6, GROUND-h2); ctx.stroke();
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx+6, GROUND-h2*0.7); ctx.lineTo(sx+26, GROUND-h2*0.9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+6, GROUND-h2*0.55); ctx.lineTo(sx-18, GROUND-h2*0.75); ctx.stroke();
  }
}
function drawGround(){
  const gaps = objects.filter(o => o.t==='gap' && o.x+o.gw > dist-40 && o.x < dist+W+40)
                      .map(o => [o.x-dist, o.x-dist+o.gw]).sort((a,b)=>a[0]-b[0]);
  let segs = [], cur = -20;
  for(const g of gaps){ if(g[0] > cur) segs.push([cur, Math.min(g[0], W+20)]); cur = Math.max(cur, g[1]); }
  if(cur < W+20) segs.push([cur, W+20]);

  for(const s of segs){
    const x0 = s[0], w0 = s[1]-s[0];
    const g = ctx.createLinearGradient(0,GROUND,0,H);
    g.addColorStop(0,'#241744'); g.addColorStop(1,'#120b26');
    ctx.fillStyle = g; ctx.fillRect(x0, GROUND, w0, H-GROUND);
    ctx.fillStyle = '#3f6d5c'; ctx.fillRect(x0, GROUND, w0, 4);
    ctx.fillStyle = 'rgba(143,227,255,0.25)'; ctx.fillRect(x0, GROUND-1, w0, 1);
    // pebbles
    for(let wx = Math.floor((dist+x0)/64)*64; wx < dist+x0+w0; wx += 64){
      const sx = wx - dist + hash(wx)*40;
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(sx, GROUND+16+hash(wx+1)*50, 10+hash(wx+2)*14, 3);
    }
  }
  // glowing chasm lips
  for(const g of gaps){
    ctx.strokeStyle = 'rgba(255,61,94,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(g[0], GROUND); ctx.lineTo(g[0], GROUND+26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g[1], GROUND); ctx.lineTo(g[1], GROUND+26); ctx.stroke();
  }
}

/* ---------------- object + player drawing ---------------- */
function drawObjects(){
  for(const o of objects){
    const sx = o.x - dist;
    if(sx < -140 || sx > W+140) continue;
    if(o.t==='ess'){
      if(o.dead) continue;
      const bob = Math.sin(t*4 + o.x)*4;
      gem(sx, o.y+bob, 11, '#8fe3ff', 14);
    } else if(o.t==='altar'){
      const rc = runeAt(level)[1], dim = o.done ? 0.35 : 1;
      ctx.save(); ctx.globalAlpha = dim;
      ctx.fillStyle = '#2a1d52';
      ctx.fillRect(sx-16, GROUND-150, 32, 150);
      ctx.fillStyle = '#3a2a6e';
      ctx.fillRect(sx-20, GROUND-158, 40, 12);
      ctx.fillRect(sx-22, GROUND-6, 44, 6);
      // carved glyph
      gem(sx, GROUND-100, 8, rc, 0);
      // beam + floating rune
      if(!o.done){
        const bg = ctx.createLinearGradient(0, GROUND-260, 0, GROUND-140);
        bg.addColorStop(0,'rgba(143,227,255,0)'); bg.addColorStop(1,'rgba(143,227,255,0.18)');
        ctx.fillStyle = bg; ctx.fillRect(sx-26, GROUND-260, 52, 120);
      }
      const bob = Math.sin(t*3 + o.x)*6;
      gem(sx, GROUND-185+bob, 13, rc, o.done ? 0 : 18);
      ctx.restore();
    } else if(o.t==='arch'){
      // pillars (safe)
      ctx.fillStyle = '#2a1d52';
      ctx.fillRect(sx-104, GROUND-170, 26, 170);
      ctx.fillRect(sx+78, GROUND-170, 26, 170);
      ctx.fillStyle = '#3a2a6e';
      ctx.fillRect(sx-108, GROUND-176, 34, 10);
      ctx.fillRect(sx+74, GROUND-176, 34, 10);
      // cursed slab (deadly)
      ctx.fillStyle = '#33235e';
      ctx.fillRect(sx-88, GROUND-150, 176, 110);
      ctx.fillStyle = '#453078';
      ctx.fillRect(sx-88, GROUND-40, 176, 8);
      const glow = 0.4 + 0.3*Math.sin(t*5);
      ctx.fillStyle = 'rgba(255,61,94,'+glow+')';
      ctx.fillRect(sx-88, GROUND-44, 176, 3);
      gem(sx-40, GROUND-95, 7, '#ff3d5e', 8); gem(sx+40, GROUND-95, 7, '#ff3d5e', 8);
    }
  }
}
function drawWizard(x, y, opts){
  const o = opts||{}, slid = o.slide, air = o.air;
  ctx.save();
  ctx.translate(x, y);
  if(slid){ ctx.rotate(-0.5); ctx.scale(1, 0.8); }
  const bob = (!air && !slid) ? Math.abs(Math.sin((o.run||0)*6))*3 : 0;

  // legs
  if(!air && !slid){
    const sw = Math.sin((o.run||0)*10);
    ctx.strokeStyle = '#241a3f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(-4 + sw*9, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -10); ctx.lineTo(4 - sw*9, 0); ctx.stroke();
  } else {
    ctx.strokeStyle = '#241a3f'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(-10, -3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -10); ctx.lineTo(10, -5); ctx.stroke();
  }

  ctx.translate(0, -bob);
  // robe
  ctx.beginPath();
  ctx.moveTo(0, -62);
  ctx.quadraticCurveTo(-20, -30, -19, -2);
  ctx.lineTo(19, -2);
  ctx.quadraticCurveTo(20, -30, 0, -62);
  ctx.closePath();
  ctx.fillStyle = '#3b2a6e'; ctx.fill();
  ctx.strokeStyle = '#8f7ce0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-17, -5); ctx.lineTo(17, -5); ctx.stroke();
  // belt
  ctx.fillStyle = '#241a3f'; ctx.fillRect(-13, -32, 26, 5);
  // staff + orb
  ctx.strokeStyle = '#6b543a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(24, -68); ctx.lineTo(31, -2); ctx.stroke();
  const pulse = 0.6 + 0.4*Math.sin(t*6);
  ctx.save(); ctx.shadowColor = o.orb||'#8fe3ff'; ctx.shadowBlur = 14*pulse;
  ctx.fillStyle = o.orb||'#8fe3ff';
  ctx.beginPath(); ctx.arc(24, -70, 6, 0, 7); ctx.fill(); ctx.restore();
  // arm to staff
  ctx.strokeStyle = '#3b2a6e'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(2, -48); ctx.lineTo(22, -52); ctx.stroke();
  // head + beard
  ctx.fillStyle = '#e8c9a8'; ctx.beginPath(); ctx.arc(0, -72, 9, 0, 7); ctx.fill();
  ctx.fillStyle = '#d8d8e8';
  ctx.beginPath(); ctx.moveTo(-6, -70); ctx.lineTo(0, -58); ctx.lineTo(6, -70); ctx.closePath(); ctx.fill();
  // hat
  ctx.fillStyle = '#2c1f52';
  ctx.beginPath(); ctx.ellipse(0, -80, 15, 4.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-12, -80); ctx.lineTo(12, -80); ctx.lineTo(3, -110); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffe97d';
  ctx.beginPath(); ctx.arc(2, -92, 2.2, 0, 7); ctx.fill();
  ctx.restore();
}
function drawDeadWizard(){
  if(!dw) return;
  ctx.save();
  ctx.translate(dw.x, dw.y); ctx.rotate(dw.rot);
  ctx.fillStyle = '#3b2a6e';
  ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(-16, 10); ctx.lineTo(16, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e8c9a8'; ctx.beginPath(); ctx.arc(0, -38, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#2c1f52';
  ctx.beginPath(); ctx.moveTo(-11, -44); ctx.lineTo(11, -44); ctx.lineTo(2, -64); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------------- HUD ---------------- */
function panel(x,y,w,h){
  ctx.fillStyle = 'rgba(10,6,24,0.6)';
  roundRect(x,y,w,h,10); ctx.fill();
  ctx.strokeStyle = 'rgba(150,120,255,0.35)'; ctx.lineWidth = 1.5;
  roundRect(x,y,w,h,10); ctx.stroke();
}
function drawHUD(){
  const rc = runeAt(level);
  // left: level + xp
  panel(16, 14, 240, 58);
  gem(40, 40, 13, rc[1], 12);
  txt(rc[3], 40, 45, 10, '#120b26', 'center', 800);
  txt('RC '+level, 62, 36, 17, '#e8e8ff');
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; roundRect(62, 44, 180, 9, 4); ctx.fill();
  const frac = Math.min(1, xp/xpNeed(level));
  ctx.fillStyle = rc[1]; roundRect(62, 44, Math.max(6, 180*frac), 9, 4); ctx.fill();
  txt(xp+'/'+xpNeed(level)+' xp', 62, 68, 11, 'rgba(232,232,255,0.6)');
  // essence counter
  gem(196, 58, 9, '#8fe3ff', 0);
  txt('×'+essence, 210, 63, 13, '#8fe3ff');
  // right: distance + best
  panel(W-206, 14, 190, 58);
  txt(Math.floor(dist)+'m', W-26, 40, 21, '#e8e8ff', 'right');
  txt('best '+best+'m', W-26, 60, 12, 'rgba(232,232,255,0.55)', 'right');
  // combo
  if(combo > 1){
    const m = (1 + 0.25*Math.min(combo-1, 8)).toFixed(2);
    const s = 15 + 2*Math.sin(t*7);
    txt('COMBO ×'+m, W/2, 38, s, '#ffe97d', 'center');
  }
  // banner
  if(banner){
    const a = Math.min(1, banner.life/0.4);
    ctx.globalAlpha = a;
    txt(banner.txt, W/2, 150, 34, '#ffe97d', 'center');
    txt(banner.sub, W/2, 178, 16, '#e8e8ff', 'center');
    ctx.globalAlpha = 1;
  }
}

/* ---------------- screens ---------------- */
function drawTitle(){
  ctx.fillStyle = 'rgba(8,5,15,0.55)'; ctx.fillRect(-40,-40,W+80,H+80);
  const glow = 0.6 + 0.4*Math.sin(t*2);
  ctx.save();
  ctx.shadowColor = '#8f7ce0'; ctx.shadowBlur = 30*glow;
  txt('RUNESPRINT', W/2, 150, 64, '#e8e8ff', 'center', 800);
  ctx.restore();
  txt('— ESSENCE ETERNAL —', W/2, 184, 17, '#8fe3ff', 'center');
  txt('Outrun the decay. Gather essence. Craft runes at the shrines.', W/2, 218, 15, 'rgba(232,232,255,0.75)', 'center');

  // wizard preview
  drawWizard(190, 360, { run: t*1.6, orb: runeAt(level)[1] });
  for(let i=0;i<6;i++){
    const a = t*1.4 + i*Math.PI/3;
    gem(190+Math.cos(a)*90, 300+Math.sin(a)*34, 8, RUNES[i%12][1], 10);
  }

  txt('SPACE / ↑  jump        ↓  slide (fast-fall in air)', W/2, 408, 15, '#e8e8ff', 'center');
  txt('P  pause        on touch: tap top = jump · tap bottom = slide', W/2, 434, 15, 'rgba(232,232,255,0.65)', 'center');
  txt('3 essence at an altar → runes + XP → level up → new runes', W/2, 462, 14, '#ffe97d', 'center');

  const bl = 0.55 + 0.45*Math.sin(t*3);
  ctx.globalAlpha = bl;
  txt('PRESS SPACE OR TAP TO RUN', W/2, 505, 18, '#8fe3ff', 'center');
  ctx.globalAlpha = 1;
}
function drawDeath(){
  const k = Math.min(1, deathT*3);           // ease-in
  const e = 1 - Math.pow(1-k, 3);
  ctx.fillStyle = 'rgba(5,2,12,'+(0.72*e)+')'; ctx.fillRect(-40,-40,W+80,H+80);

  const pw = 560, ph = 380, px = (W-pw)/2, py = 78 + (1-e)*40;
  ctx.save();
  ctx.translate(W/2, py+ph/2); ctx.scale(e, e); ctx.translate(-W/2, -(py+ph/2));
  ctx.shadowColor = 'rgba(255,61,94,0.5)'; ctx.shadowBlur = 34;
  ctx.fillStyle = '#171030';
  roundRect(px, py, pw, ph, 16); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,61,94,0.7)'; ctx.lineWidth = 2;
  roundRect(px+5, py+5, pw-10, ph-10, 12); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,120,255,0.35)'; ctx.lineWidth = 1;
  roundRect(px, py, pw, ph, 16); ctx.stroke();

  const gl = 0.7 + 0.3*Math.sin(t*4);
  ctx.save(); ctx.shadowColor = '#ff3d5e'; ctx.shadowBlur = 22*gl;
  txt('OH DEAR, YOU ARE DEAD!', W/2, py+58, 30, '#ff3d5e', 'center', 800);
  ctx.restore();
  txt(deathInfo.reason==='fall' ? 'The abyss claimed you.' : 'Clipped by a cursed archway.', W/2, py+84, 15, 'rgba(232,232,255,0.7)', 'center');
  if(deathInfo.newBest){
    const b = 0.6 + 0.4*Math.sin(t*6);
    ctx.globalAlpha = b;
    txt('★ NEW BEST RUN ★', W/2, py+112, 16, '#ffe97d', 'center');
    ctx.globalAlpha = 1;
  }

  const rows = [
    ['Distance', Math.floor(deathInfo.dist)+'m'],
    ['Essence gathered', deathInfo.essenceGot],
    ['Runes crafted', deathInfo.runes],
    ['XP earned', deathInfo.xp],
    ['Runecrafting level', deathInfo.level],
    ['Best run', best+'m']
  ];
  const rc = runeAt(deathInfo.level);
  rows.forEach((r, i) => {
    const y = py+150 + i*32, cx = px+70;
    txt(r[0], cx, y, 16, 'rgba(232,232,255,0.75)');
    txt(String(r[1]), px+pw-70, y, 18, i===0 && deathInfo.newBest ? '#ffe97d' : '#e8e8ff', 'right');
  });
  // rune gems row
  for(let i=0;i<3;i++) gem(px+pw/2-30+i*30, py+ph-28, 9, rc[1], 10);
  txt(rc[0]+' runes attuned', px+pw/2+70, py+ph-23, 13, rc[1]);

  if(deathT > 0.5){
    const bl = 0.55 + 0.45*Math.sin(t*3);
    ctx.globalAlpha = bl;
    txt('SPACE OR TAP — RUN AGAIN', W/2, py+ph+38, 17, '#8fe3ff', 'center');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawPause(){
  ctx.fillStyle = 'rgba(8,5,15,0.6)'; ctx.fillRect(-40,-40,W+80,H+80);
  txt('PAUSED', W/2, 250, 44, '#e8e8ff', 'center', 800);
  txt('P or tap to resume', W/2, 286, 16, 'rgba(232,232,255,0.7)', 'center');
}

/* ---------------- render ---------------- */
function render(){
  drawSky();
  ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
  ctx.translate(view.ox, view.oy); ctx.scale(view.s, view.s);
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  drawWorldBG();
  drawGround();
  drawObjects();
  // particles
  for(const p of parts){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(mode==='dead'){ drawDeadWizard(); }
  else if(mode!=='title'){
    drawWizard(PX, player.y, {
      run: player.run,
      slide: player.slide > 0 && player.y >= GROUND-1,
      air: player.y < GROUND-1,
      orb: runeAt(level)[1]
    });
  }
  // floaters
  for(const f of floats){
    ctx.globalAlpha = Math.min(1, f.life*2);
    txt(f.txt, f.x, f.y, f.big ? 24 : 15, f.col, 'center');
  }
  ctx.globalAlpha = 1;

  if(mode==='play' || mode==='paused') drawHUD();
  if(mode==='title') drawTitle();
  else if(mode==='dead') drawDeath();
  else if(mode==='paused') drawPause();
}

/* ---------------- input ---------------- */
function toWorld(e){
  const r = cvs.getBoundingClientRect();
  return [(e.clientX - r.left - view.ox)/view.s, (e.clientY - r.top - view.oy)/view.s];
}
function pressAction(wx, wy){
  initAudio();
  if(mode==='title'){ start(); return; }
  if(mode==='dead'){ if(deathT > 0.5) start(); return; }
  if(mode==='paused'){ mode='play'; return; }
  if(mode==='play'){
    jumpHeld = true;
    if(wy > H*0.62) doSlide(); else doJump();
  }
}
cvs.addEventListener('pointerdown', e => { e.preventDefault(); const [wx,wy] = toWorld(e); pressAction(wx,wy); });
window.addEventListener('pointerup', () => { jumpHeld = false; if(player.vy < -280) player.vy = -280; });
window.addEventListener('pointercancel', () => { jumpHeld = false; });
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  initAudio();
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW'){
    e.preventDefault();
    if(mode==='title' || (mode==='dead' && deathT > 0.5)) start();
    else if(mode==='paused') mode='play';
    else if(mode==='play'){ jumpHeld = true; doJump(); }
  } else if(e.code==='ArrowDown' || e.code==='KeyS'){
    e.preventDefault(); doSlide();
  } else if(e.code==='KeyP' || e.code==='Escape'){
    if(mode==='play') mode='paused'; else if(mode==='paused') mode='play';
  } else if(e.code==='Enter'){
    if(mode==='title' || (mode==='dead' && deathT > 0.5)) start();
  }
});
window.addEventListener('keyup', e => {
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW'){
    jumpHeld = false; if(player.vy < -280) player.vy = -280;
  }
});
document.addEventListener('visibilitychange', () => { if(document.hidden && mode==='play') mode='paused'; });
window.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- main loop (fixed timestep) ---------------- */
const STEP = 1/120;
let acc = 0, last = performance.now();
function frame(now){
  let dt = (now - last)/1000; last = now;
  if(dt > 0.1) dt = 0.1;
  acc += dt;
  let guard = 0;
  while(acc >= STEP && guard++ < 20){ update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
