<head>

<title>Runesprint — Runecrafting Run</title>
<style>

:root{color-scheme:dark;font-family:Manrope,system-ui,sans-serif;background:#101a20;color:#f4ead5}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#101a20}canvas{display:block;width:100vw;height:100vh;touch-action:none}#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#e4d7bf99;font:11px 'DM Mono',monospace;letter-spacing:.08em;pointer-events:none;text-align:center;white-space:nowrap}#touch{position:fixed;bottom:22px;right:20px;display:none;gap:10px}#touch button{width:62px;height:62px;border:1px solid #e6d3aa55;border-radius:18px;background:#17242bd9;color:#f3e7d0;font-size:23px;box-shadow:0 6px 20px #0005;touch-action:none}#touch button:active{background:#b88145;color:#fff}@media(max-width:700px){#touch{display:flex}#hint{bottom:94px;font-size:9px} }

<body>
<canvas id="game" aria-label="Runesprint game"></canvas>
<div id="hint">SPACE / ↑ JUMP &nbsp;·&nbsp; ↓ SLIDE &nbsp;·&nbsp; P PAUSE</div>
<div id="touch"><button id="jump" aria-label="Jump">↑</button><button id="slide" aria-label="Slide">↓</button></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1200,H=700,ground=535;
let dpr=1,scale=1,ox=0,oy=0,portrait=false;
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;portrait=innerHeight>innerWidth;if(portrait){scale=canvas.height/H;ox=canvas.width/2-250*scale;oy=0}else{scale=Math.min(canvas.width/W,canvas.height/H);ox=(canvas.width-W*scale)/2;oy=(canvas.height-H*scale)/2}}
addEventListener('resize',resize);resize();
const runes=[['Air',1,5],['Mind',2,5.5],['Water',5,6],['Earth',9,6.5],['Fire',14,7],['Body',20,7.5],['Cosmic',27,8],['Chaos',35,8.5],['Nature',44,9],['Law',54,9.5],['Death',65,10],['Blood',77,10.5]];
const xpForLevel=l=>l<2?0:Math.floor(Array.from({length:l-1},(_,i)=>Math.floor((i+1)+300*Math.pow(2,(i+1)/7))).reduce((a,b)=>a+b,0)/4);
const levelForXp=x=>{let l=1;while(l<99&&xpForLevel(l+1)<=x)l++;return l};
let mode='title',last=0,elapsed=0,dist=0,speed=310,essence=0,runesMade=0,xp=0,level=1,best=+(localStorage.getItem('runesprintBest')||0),craftCount=0;
let player={y:ground,vy:0,jump:false,slide:0,run:0,invuln:0};
let objects=[],particles=[],floaters=[],shake=0,altarFlash=0,craftText='',craftTextTime=0,spawnTimer=1.0,altarTimer=0,worldSeed=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){mode='running';dist=0;speed=310;essence=0;runesMade=0;xp=0;level=1;craftCount=0;elapsed=0;objects=[];particles=[];floaters=[];player={y:ground,vy:0,jump:false,slide:0,run:0,invuln:0};spawnTimer=.8;altarTimer=1050;craftText='';}
function start(){reset()}
function pause(){if(mode==='running')mode='paused';else if(mode==='paused')mode='running'}
function jump(){if(mode==='title'||mode==='over'){start();return}if(mode!=='running')return;if(!player.jump&&player.y>=ground-1){player.vy=-735;player.jump=true;burst(250,ground-25,'#d7c58c',7)}}
function slide(){if(mode==='title'||mode==='over'){start();return}if(mode==='running')player.slide=.62}
function actionAt(x,y){x=(x-ox)/scale;y=(y-oy)/scale;if(mode==='title'){start();return}if(mode==='over'){if(y>435&&y<540){start();return}if(y>540){mode='title';return}}if(mode==='paused'){mode='running';return}if(x>1125&&y<70)pause()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture?.(e.pointerId);actionAt(e.offsetX*dpr,e.offsetY*dpr)});
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();slide()}else if(e.code==='KeyP'||e.code==='Escape')pause()});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.getElementById('slide').addEventListener('pointerdown',e=>{e.preventDefault();slide()});
function addObject(type,x){objects.push({type,x,y:type==='essence'?rand(ground-120,ground-58):ground,phase:rand(0,7),r:rand(0,1)})}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-125,125),vy:rand(-180,40),life:rand(.35,.8),max:.8,color,size:rand(2,5)})}
function floatText(text,x,y,color='#ead49d'){floaters.push({text,x,y,life:1.4,color})}
function craft(){if(essence<=0)return;const rune=runes.filter(r=>r[1]<=level).at(-1);let amount=essence;essence=0;runesMade+=amount;craftCount++;const gain=Math.round(amount*rune[2]);let before=level;xp+=gain;level=levelForXp(xp);altarFlash=1;craftText=`+${amount} ${rune[0].toUpperCase()} RUNES  ·  +${gain} XP`;craftTextTime=2.8;floatText(`+${amount} ${rune[0]} runes`,735,282,'#f1cb79');burst(735,360,'#a8def0',28);if(level>before){floatText(`RUNEC​​RAFTING LEVEL ${level}!`,600,220,'#ffdb85');}
}
function crash(){if(player.invuln>0)return;mode='over';shake=11;burst(245,ground-30,'#dc9c65',25);best=Math.max(best,Math.floor(dist));localStorage.setItem('runesprintBest',best)}
function update(dt){if(mode!=='running')return;elapsed+=dt;dist+=speed*dt/10;speed=Math.min(490,310+dist*.035);player.run+=dt*13;player.slide=Math.max(0,player.slide-dt);player.invuln=Math.max(0,player.invuln-dt);
player.vy+=1900*dt;player.y+=player.vy*dt;if(player.y>=ground){player.y=ground;player.vy=0;player.jump=false}
spawnTimer-=dt;if(spawnTimer<=0){let r=Math.random();if(r<.48)addObject('essence',W+50);else if(r<.76)addObject('rock',W+55);else if(r<.89)addObject('wisp',W+45);else addObject('essence',W+55);spawnTimer=rand(.72,1.42)*Math.max(.66,360/speed)}
altarTimer-=speed*dt;if(altarTimer<=0){addObject('altar',W+70);altarTimer=rand(920,1240)}
for(const o of objects){o.x-=speed*dt;o.phase+=dt*2.7;if(o.type==='essence'){let dx=o.x-250,dy=(player.y-28)-(o.y+Math.sin(o.phase)*6);if(Math.abs(dx)<38&&Math.abs(dy)<48){o.got=true;essence++;burst(o.x,o.y,'#a9d8e5',8);floatText('+1 essence',o.x,o.y-18,'#bde7f2')}}else if(o.type==='rock'||o.type==='wisp'){let px=250,py=player.y-28;let danger=o.type==='rock'?Math.abs(o.x-px)<33&&player.y>ground-35:Math.abs(o.x-px)<32&&player.slide<=0;if(danger&&!o.hit){o.hit=true;crash()}}else if(o.type==='altar'&&o.x<256&&!o.done){o.done=true;craft()}}
objects=objects.filter(o=>o.x>-120&&!o.got);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const f of floaters){f.y-=30*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);craftTextTime=Math.max(0,craftTextTime-dt);altarFlash=Math.max(0,altarFlash-dt*1.1);shake=Math.max(0,shake-dt*25)}
function frame(t){let dt=Math.min(.034,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function rr(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function text(s,x,y,size,color,weight=600,align='left',font='Manrope'){ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y)}
function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function circle(x,y,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#101a20';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,ox,oy);if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawWorld();if(portrait){if(mode==='title')drawPortraitTitle();else{drawPortraitHUD();if(mode==='paused')drawPortraitPause();if(mode==='over')drawPortraitOver()}}else if(mode==='title')drawTitle();else{drawHUD();if(mode==='paused')drawPause();if(mode==='over')drawOver()}}
function drawWorld(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1b3037');sky.addColorStop(.58,'#687b70');sky.addColorStop(1,'#c1a477');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// distant moons and stars
circle(982,125,62,'#e7d6a51a');circle(982,125,39,'#e8d9ba55');circle(998,115,38,'#263941');for(let i=0;i<42;i++){let x=(i*173+42)%W,y=(i*79+22)%300;circle(x,y,((i*3)%4)/2+.7,'#f3e7c977')}
// mountain silhouettes
ctx.beginPath();ctx.moveTo(0,397);for(let x=0;x<=W;x+=8){let y=340+Math.sin((x+dist*.09)/130)*35+Math.sin(x/47)*9;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle='#425d59';ctx.fill();ctx.beginPath();ctx.moveTo(0,426);for(let x=0;x<=W;x+=8)ctx.lineTo(x,373+Math.sin((x+dist*.2)/155)*27+Math.sin(x/72)*14);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle='#344d48';ctx.fill();
// distant ruins
for(let i=0;i<7;i++){let x=((i*230-dist*.24)%1450+1450)%1450-80;ctx.fillStyle='#243a3a99';ctx.fillRect(x,300,17,100);ctx.fillRect(x-9,295,35,10);ctx.fillRect(x+16,320,31,78);ctx.fillRect(x+10,316,43,8)}
// floating wisps in the sky
for(let i=0;i<9;i++){let x=((i*167-dist*.12)%1250+1250)%1250;let y=220+(i%3)*49+Math.sin(elapsed*1.1+i)*7;circle(x,y,3,'#eac87955');circle(x,y,1.3,'#fff0bf')}
// ground
ctx.fillStyle='#263a33';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#8c7652';ctx.fillRect(0,ground,W,6);ctx.fillStyle='#bba274';ctx.fillRect(0,ground+6,W,2);for(let i=0;i<95;i++){let x=((i*83-dist*7)%1300+1300)%1300;let y=ground+18+(i*31)%130;line(x,y,x+12,y-2,'#82916d55',1)}
// path markings
for(let i=0;i<20;i++){let x=((i*95-dist*7)%1320+1320)%1320;ctx.fillStyle='#d5c18b22';ctx.fillRect(x,ground+1,36,2)}
// trees, shrubs
for(let i=0;i<12;i++){let x=((i*137-dist*.55)%1500+1500)%1500-120;let h=65+(i*31)%50;ctx.fillStyle='#223c34';ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x+13,ground-h);ctx.lineTo(x+27,ground);ctx.fill();ctx.beginPath();ctx.moveTo(x+6,ground-h*.55);ctx.lineTo(x+20,ground-h-13);ctx.lineTo(x+34,ground-h*.55);ctx.fill();circle(x+48,ground-13,12,'#405846')}
for(const o of objects)drawObject(o);
// altar arrival glow
if(altarFlash>0){ctx.fillStyle=`rgba(141,205,224,${altarFlash*.15})`;ctx.fillRect(0,0,W,H)}
drawWizard();for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);circle(p.x,p.y,p.size,p.color)}ctx.globalAlpha=1;for(const f of floaters){ctx.globalAlpha=clamp(f.life,0,1);text(f.text,f.x,f.y,13,f.color,700,'center')}ctx.globalAlpha=1;
}
function drawObject(o){if(o.type==='essence'){let y=o.y+Math.sin(o.phase)*6;ctx.save();ctx.translate(o.x,y);ctx.rotate(Math.sin(o.phase)*.18);ctx.shadowColor='#9ce4f7';ctx.shadowBlur=15;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(10,-5);ctx.lineTo(8,9);ctx.lineTo(0,14);ctx.lineTo(-8,9);ctx.lineTo(-10,-5);ctx.closePath();ctx.fillStyle='#a5d7e1';ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e7ffff';ctx.lineWidth=1.5;ctx.stroke();line(-3,-6,3,7,'#fff9');ctx.restore();circle(o.x,y,17,'#bdeeff0a')}
else if(o.type==='rock'){ctx.fillStyle='#604d3b';ctx.beginPath();ctx.moveTo(o.x-25,ground);ctx.lineTo(o.x-22,ground-24);ctx.lineTo(o.x-8,ground-40);ctx.lineTo(o.x+9,ground-34);ctx.lineTo(o.x+25,ground-11);ctx.lineTo(o.x+23,ground);ctx.closePath();ctx.fill();line(o.x-9,ground-28,o.x+3,ground-20,'#a78d65',2);line(o.x+5,ground-24,o.x+15,ground-14,'#806c4e',2)}
else if(o.type==='wisp'){let y=ground-43+Math.sin(o.phase*2)*4;circle(o.x,y,13,'#b44c42');circle(o.x,y,9,'#f08962');circle(o.x-3,y-2,2,'#ffe3bd');circle(o.x+4,y-2,2,'#ffe3bd');line(o.x-13,y+15,o.x-6,y+23,'#c46150',2);line(o.x+12,y+15,o.x+5,y+22,'#c46150',2)}
else if(o.type==='altar'){drawAltar(o.x,ground,1);}}
function drawAltar(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.shadowColor='#95d9ed';ctx.shadowBlur=altarFlash*30+6;ctx.fillStyle='#536c70';ctx.beginPath();ctx.moveTo(-44,0);ctx.lineTo(-35,-62);ctx.lineTo(35,-62);ctx.lineTo(44,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#788d89';ctx.fillRect(-31,-67,62,8);ctx.fillStyle='#42575a';ctx.fillRect(-26,-55,52,55);ctx.strokeStyle='#bbd4c888';ctx.lineWidth=2;ctx.strokeRect(-30,-62,60,62);ctx.beginPath();ctx.arc(0,-48,19,0,Math.PI*2);ctx.fillStyle='#2c444d';ctx.fill();ctx.strokeStyle='#c9d8bd';ctx.stroke();circle(0,-48,10,'#a5e0dc');circle(0,-48,5,'#e6f4cf');line(-45,-2,45,-2,'#d7c89a',4);text('ALTAR',0,20,10,'#dac99a',700,'center','DM Mono');ctx.restore()}
function drawWizard(){let x=250,y=player.y,run=Math.sin(player.run)*6,slideY=player.slide>0?22:0;ctx.save();ctx.translate(x,y-slideY);ctx.globalAlpha=player.invuln>0?.55+Math.sin(elapsed*25)*.35:1;ctx.fillStyle='#15211e77';ctx.beginPath();ctx.ellipse(0,2,26,7,0,0,Math.PI*2);ctx.fill();
// legs and boots
if(player.slide>0){rr(-24,-28,43,17,7,'#533f37');rr(9,-24,24,12,5,'#a7774c');rr(-25,-15,25,11,4,'#bc9665');}
else{line(-9,-25,-14+run,-6,'#dec78b',7);line(10,-25,14-run,-5,'#dec78b',7);line(-14+run,-6,-22+run,-1,'#4a352f',8);line(14-run,-5,23-run,-1,'#4a352f',8)}
// robe
ctx.fillStyle='#354e64';ctx.beginPath();ctx.moveTo(-18,-72);ctx.quadraticCurveTo(-3,-81,14,-71);ctx.lineTo(25,-5);ctx.quadraticCurveTo(2,2,-25,-5);ctx.closePath();ctx.fill();ctx.strokeStyle='#a89d79';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#bfaa77';ctx.beginPath();ctx.moveTo(-18,-72);ctx.lineTo(0,-64);ctx.lineTo(15,-72);ctx.lineTo(7,-53);ctx.lineTo(-8,-53);ctx.closePath();ctx.fill();circle(0,-56,3,'#eff0c4');
// arm, staff
line(14,-60,25,-40,'#d7c38c',6);line(25,-40,34,-53,'#d7c38c',4);line(34,-53,36,-103,'#594633',4);circle(36,-108,7,'#b3e1df');circle(36,-108,3,'#fff2c2');
// head, hair and hat
circle(-1,-82,13,'#d8a777');ctx.fillStyle='#46362f';ctx.beginPath();ctx.arc(-3,-86,13,Math.PI,Math.PI*2);ctx.lineTo(11,-81);ctx.lineTo(-15,-80);ctx.fill();circle(4,-83,1.5,'#263033');
ctx.fillStyle='#493d57';ctx.beginPath();ctx.moveTo(-22,-94);ctx.lineTo(7,-145);ctx.lineTo(17,-95);ctx.quadraticCurveTo(-3,-88,-22,-94);ctx.fill();ctx.strokeStyle='#b8a477';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(-3,-94,23,5,0,0,Math.PI*2);ctx.stroke();line(-7,-118,6,-114,'#d7bc78',3);ctx.restore();}
function drawHUD(){// Header brand and stat cards
rr(28,22,260,68,17,'#142228d9','#d7c69b42');circle(57,56,17,'#b58a54');text('✦',57,57,20,'#fff2c8',600,'center');text('RUNESPRINT',85,45,17,'#f4ead5',800);text('A RUNEC​​RAFTING RUN',85,68,9,'#a8b5a5',500,'left','DM Mono');
rr(310,22,203,68,15,'#142228cc','#d7c69b35');text('DISTANCE',330,42,9,'#a7b3a5',500,'left','DM Mono');text(`${Math.floor(dist)} m`,330,66,21,'#f3e7d0',700);line(414,39,414,74,'#d4c39736');text('BEST',431,43,9,'#a7b3a5',500,'left','DM Mono');text(`${best} m`,431,66,17,'#dfc99a',700);
rr(532,22,290,68,15,'#142228cc','#d7c69b35');circle(565,56,19,'#385d66');text('✧',565,57,20,'#c5eced',600,'center');text('RUNEC​​RAFTING',596,41,9,'#a7b3a5',500,'left','DM Mono');text(`LEVEL ${level}`,596,62,19,'#f3e7d0',800);let p=(xp-xpForLevel(level))/Math.max(1,xpForLevel(level+1)-xpForLevel(level));rr(596,76,205,5,3,'#33433f');rr(596,76,205*clamp(p,0,1),5,3,'#d5b66e');text(`${xp.toLocaleString()} XP`,802,78,9,'#b5b39a',500,'right','DM Mono');
rr(840,22,160,68,15,'#142228cc','#d7c69b35');text('ESSENCE',860,42,9,'#a7b3a5',500,'left','DM Mono');circle(868,65,10,'#a8d7e2');circle(868,65,4,'#eef5df');text(`${essence}`,888,66,22,'#eff1d9',800);text('to craft',930,67,10,'#a7b3a5',500);
rr(1018,22,154,68,15,'#142228cc','#d7c69b35');text('RUNES MADE',1037,42,9,'#a7b3a5',500,'left','DM Mono');text(`${runesMade}`,1037,66,22,'#dfc98d',800);rr(1128,101,44,30,10,'#142228bb','#e0d0a244');text('Ⅱ',1150,116,15,'#e7d8b8',700,'center');
// upcoming rune progression strip
rr(28,104,235,42,12,'#142228aa','#d7c69b2e');const current=runes.filter(r=>r[1]<=level).at(-1),next=runes.find(r=>r[1]>level);text('NEXT ALTAR',44,118,8,'#a7b3a5',500,'left','DM Mono');text(current?`${current[0]} rune`:'—',44,135,12,'#e8d4a0',700);if(next)text(`NEXT  ${next[0]} · LV ${next[1]}`,246,125,9,'#bad0c8',600,'right','DM Mono');
if(craftTextTime>0){rr(376,125,448,42,12,'#253d3bdd','#bdd7cb55');text(craftText,600,146,13,'#f4e1a8',700,'center')}
if(dist<190&&elapsed>1){rr(429,580,344,43,13,'#142228b8','#d7c69b24');text('Collect essence  →  reach an altar  →  craft runes',601,602,12,'#e6ddc9',600,'center')}
}
function drawTitle(){// Title screen overlay and hero panel
ctx.fillStyle='#08111588';ctx.fillRect(0,0,W,H);rr(74,76,1052,548,28,'#101d22e8','#e0c99555',1.5);ctx.save();ctx.beginPath();ctx.roundRect(75,77,1050,546,27);ctx.clip();ctx.fillStyle='#b99b6833';ctx.beginPath();ctx.ellipse(860,310,320,220,-.4,0,Math.PI*2);ctx.fill();drawAltar(912,510,1.65);for(let i=0;i<8;i++){let x=735+i*55;circle(x,490-Math.sin(i)*28,7,'#bce3e7');circle(x,490-Math.sin(i)*28,3,'#fff')};ctx.restore();drawWizardPreview(860,510);
text('A RUNEC​​RAFTING ENDLESS RUNNER',130,151,11,'#d2ba7e',700,'left','DM Mono');text('The path to',130,220,53,'#f4ead5',800);text('the altar.',130,278,53,'#e4c57c',800);text('Run, gather essence, and shape it into runes.',132,327,16,'#c5cec0',500);text('Every altar brings you closer to the next rune.',132,354,16,'#c5cec0',500);
